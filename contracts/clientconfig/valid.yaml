schema_version: 2
default: primary
endpoints:
  primary:
    role: signer
    url: ssh://signer.example.com:2222/
    signer_port: 11271
    local_port: 18080
    identity_file: .ssh/primary
    known_hosts_path: .ssh/known_hosts
  cosigner.qa:
    role: cosigner
    url: https://cosigner.example.com/
    token_file: credentials/cosigner.token
